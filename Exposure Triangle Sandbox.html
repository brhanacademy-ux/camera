let audioCtx = null;

  try {

    if (!audioCtx) audioCtx = new AC(); const c = audioCtx; if (c.state === 'suspended') c.resume();
    const click = (t, f, g) => {
      const len = Math.floor(c.sampleRate * 0.05), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);

      const fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = 1.2;
      const gn = c.createGain(); gn.gain.value = g; s.connect(fl); fl.connect(gn); gn.connect(c.destination); s.start(t);
    };

    const o = c.createOscillator(), og = c.createGain();

    og.gain.setValueAtTime(0.5, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);

function Meter({ ev }) {
  const c = Math.max(-3, Math.min(3, ev)), ok = Math.abs(ev) <= 0.34;
  const col = ok ? '#4ade80' : Math.abs(ev) <= 1 ? '#fbbf24' : '#f87171';
  const ticks = []; for (let i = -6; i <= 6; i++) ticks.push(h('div', { key: i, className: 'flex flex-col items-center', style: { width: 0 } },
    h('div', { className: i % 2 ? 'bg-white/40' : 'bg-white/80', style: { width: 1, height: i % 2 ? 6 : 10 } }),
    i % 2 === 0 ? h('div', { className: 'text-[9px] font-mono text-white/80 mt-0.5 whitespace-nowrap' }, i === 0 ? '0' : (i > 0 ? '+' : '') + i / 2 * 1) : null));
  return h('div', { className: 'flex items-center gap-2' },
    h('span', { className: 'text-[10px] font-mono text-white/70' }, '−'),
    h('div', { className: 'relative flex justify-between', style: { width: 'min(52vw,230px)', height: 30 } },
      h('div', { className: 'absolute rounded-full', style: { left: `${(c + 3) / 6 * 100}%`, top: -3, width: 0, height: 0, borderLeft: '5px solid transparent', borderRight: '5px solid transparent', borderTop: `8px solid ${col}`, transform: 'translateX(-5px)', transition: 'left .15s' } }),
      ticks),
    h('span', { className: 'text-[10px] font-mono text-white/70' }, '+'),
    h('span', { className: 'font-mono text-xs font-bold w-14', style: { color: col } }, (ev > 0 ? '+' : '') + ev.toFixed(1) + ' EV'));
}

        h('div', { className: 'flex flex-wrap gap-2 items-center justify-between mt-2 text-xs font-mono text-zinc-300' }, h('span', null, nm(view) + ' · ' + label(view) + ' · ' + (view.ev > 0 ? '+' : '') + view.ev.toFixed(1) + ' EV'),
          h('div', { className: 'flex gap-2' },
            h('a', { href: view.url, download: 'exposure-sandbox.jpg', className: 'flex items-center gap-1 px-2 py-1 rounded bg-white/10 hover:bg-white/20' }, h(Icon, { n: 'download', s: 14 }), t.save),
            h('button', { onClick: () => setView(null), className: 'flex items-center gap-1 px-2 py-1 rounded bg-white/10 hover:bg-white/20' }, h(Icon, { n: 'x', s: 14 }), t.close))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
