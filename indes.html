  const g=x.createLinearGradient(0,0,0,360);g.addColorStop(0,'#1e3a8a');g.addColorStop(.55,'#f97316');g.addColorStop(1,'#7c2d12');
  x.fillStyle=g;x.fillRect(0,0,580,360);
  x.fillStyle='#fde047';x.beginPath();x.arc(440,200,36,0,7);x.fill();
  x.fillStyle='#0b0f1a';x.beginPath();x.moveTo(0,360);for(let i=0;i<=580;i+=20)x.lineTo(i,260+Math.sin(i*.02)*30+Math.sin(i*.05)*12);x.lineTo(580,360);x.fill();
  x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,580,34);x.fillRect(0,326,580,34);
  x.fillStyle='#fff';x.font='600 18px monospace';x.fillText('M   1/250   F2.8   ISO 100   +0.0',14,23);x.fillText('RAW   BATT 100%   [7240]',14,349);
  x.strokeStyle='#4ade80';x.lineWidth=3;x.strokeRect(250,120,80,80);
  x.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<40;i++){const hh=8+Math.abs(Math.sin(i*.3))*40;x.fillRect(440+i*3,310-hh,2,hh)}

}

  const c=document.createElement('canvas');c.width=256;c.height=170;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,256,170);g.addColorStop(0,'#6d28d9');g.addColorStop(.5,'#0ea5e9');g.addColorStop(1,'#14b8a6');
  x.fillStyle=g;x.fillRect(0,0,256,170);

  for(let i=0;i<32;i++)for(let j=0;j<21;j++){x.fillStyle=cols[(i%2)+(j%2)*2];x.globalAlpha=.3;x.fillRect(i*8,j*8,7,7)}

  // 4. BODY
  g=grp('body');M=(c,o)=>mk('body',c,o);
  const shell=M(0x1b1c20,{m:.45,r:.55,x:1}),top=M(0x8d9199,{m:.9,r:.35,x:1}),rb=M(0x111113,{m:.1,r:.95,x:1}),btn=M(0x2c2e33,{m:.6,r:.4,x:1}),dm=M(0xb7bcc4,{m:.95,r:.3,x:1}),red=M(0xe11d2e,{m:.3,r:.5});
  mesh(g,rbox(4.6,2.6,2,.3),shell);
  mesh(g,cyl(.75,.75,2.6,40),rb,-2.3,0,.45);
  mesh(g,rbox(1.5,2.6,1.3,.25),rb,-2.3,0,-.35);
  mesh(g,rbox(5.35,.3,2,.12),top,-.375,1.45,0);
  mesh(g,cyl(.42,.42,.28,40),dm,1.85,1.74,.3);mesh(g,cyl(.3,.3,.05,32),btn,1.85,1.9,.3);mesh(g,box3(.06,.05,.25),red,1.85,1.94,.3);
  mesh(g,cyl(.3,.3,.24,32),dm,1,1.72,.45);
  mesh(g,cyl(.28,.28,.1,32),dm,-2.4,1.65,.3);mesh(g,cyl(.15,.15,.14,24),red,-2.4,1.74,.3);
  mesh(g,cyl(.3,.3,.16,32),btn,-1.45,1.68,-.3);
  mesh(g,box3(.95,.05,.9),dm,0,1.63,.5);
  mesh(g,cyl(.3,.3,.06,32),btn,-2,-.2,-1.03,Z);
  for(const[x,y]of[[-1.9,.5],[-2.6,.5],[-2.6,-.4]])mesh(g,cyl(.1,.1,.06,20),btn,x,y,-1.03,Z);
  mesh(g,cyl(.1,.1,.1,20),dm,1.7,-.55,1.04,Z);
  mesh(g,box3(.2,.3,.25),dm,2.4,.9,-.2);
  mesh(g,new T.CircleGeometry(1,48),M(0x020203,{m:.2,r:.8,x:1}),0,0,1.004);

  // 5. EVF + LCD
  g=grp('evf');M=(c,o)=>mk('evf',c,o);
  mesh(g,rbox(1.5,.85,1.05,.25),shell,0,2.03,-.47);
  mesh(g,box3(1,.65,.22),rb,0,2.03,-1.1);
  mesh(g,box3(.72,.46,.02),M(0x1e3a8a,{m:.2,r:.1,e:0x0a1f55}),0,2.03,-1.22);
  mesh(g,rbox(3.1,2,.18,.18),M(0x0a0a0c,{m:.4,r:.5,x:1}),.35,-.1,-1.09);
  const scr=new T.Mesh(new T.PlaneGeometry(2.9,1.8),new T.MeshBasicMaterial({map:lcdTex(),toneMapped:false}));
  scr.position.set(.35,-.1,-1.19);scr.rotation.y=PI;g.add(scr);

  // offsets (z added when fully exploded) and label anchors
  const OFF={evf:-3.2,body:0,sensor:2,mount:3.8,lens:6},BASE={sensor:.55,mount:1.02,lens:1.05};
  const ANC={lens:[0,1.5,2],mount:[0,1.6,0],sensor:[0,1.3,0],body:[-3.05,.3,.4],evf:[0,2.6,-.5]};
  const acc={};PARTS.forEach(p=>acc[p.id]=new T.Color(p.color));

  // labels
  const labels={};
  PARTS.forEach(p=>{const b=document.createElement('button');b.className='lbl';b.innerHTML='<i style="background:'+p.color+'"></i>'+p.name;b.onclick=()=>onSelect(p.id);box.appendChild(b);labels[p.id]=b});

  // interaction state
  let th=.7,ph=.25,zoom=1,asm=S.asm/100,xr=0,hover=null,t=0,raf,drag=null,pd=0;
  const ptr=new Map(),ray=new T.Raycaster(),ndc=new T.Vector2(),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const partOf=o=>{while(o&&!o.userData.part)o=o.parent;return o&&o.userData.part};
  function pick(e){
    const r=el.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
    ray.setFromCamera(ndc,cam);
    const ids=ray.intersectObjects(Object.values(G),true).map(x=>partOf(x.object));
    if(!ids.length)return null;
    if(S.xray&&ids.includes('sensor')&&(ids[0]==='body'||ids[0]==='evf'))return'sensor';
    return ids[0]}
  const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};
  el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptr.size===1)drag={sx:e.clientX,sy:e.clientY,moved:false};else{if(drag)drag.moved=true;pd=dist()}};
  el.onpointermove=e=>{
    const p=ptr.get(e.pointerId);
    if(!p){hover=pick(e);el.style.cursor=hover?'pointer':'grab';return}
    if(ptr.size===2){p.x=e.clientX;p.y=e.clientY;const d=dist();zoom=clamp(zoom*pd/d,.45,2);pd=d;return}
    th-=(e.clientX-p.x)*.006;ph=clamp(ph+(e.clientY-p.y)*.006,-1.2,1.3);p.x=e.clientX;p.y=e.clientY;
    if(drag&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4)drag.moved=true};
  el.onpointerup=e=>{if(ptr.size===1&&drag&&!drag.moved)onSelect(pick(e));ptr.delete(e.pointerId);if(!ptr.size)drag=null};
  el.onpointercancel=e=>{ptr.delete(e.pointerId);drag=null};
  el.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(e.deltaY*.001),.45,2)},{passive:false});

  function resize(){const w=box.clientWidth,hh=box.clientHeight;renderer.setSize(w,hh,false);cam.aspect=w/hh;cam.updateProjectionMatrix()}
  const ro=new ResizeObserver(resize);ro.observe(box);resize();
  const v=new T.Vector3();

  function frame(){
    raf=requestAnimationFrame(frame);t+=.016;
    asm+=(S.asm/100-asm)*.12;const e=1-asm;
    for(const id in G)G[id].position.z=(BASE[id]??0)+OFF[id]*e;
    ax.material.opacity=.4*e;
    if(S.reset){th=.7;ph=.25;zoom=1;S.reset=false}
    if(S.spin&&!drag)th+=.005;
    const r=13*zoom*(1+e*.9),tz=1.4+e*3;
    cam.position.set(r*Math.sin(th)*Math.cos(ph),.3+r*Math.sin(ph),tz+r*Math.cos(th)*Math.cos(ph));
    cam.lookAt(0,.3,tz);
    // x-ray fade
    xr+=((S.xray?1:0)-xr)*.15;
    for(const id in gm)for(const m of gm[id])if(m.userData.x){m.opacity=1-.86*xr;const tr=m.opacity<.995;m.transparent=tr;m.depthWrite=!tr}
    for(const l of edges){l.visible=xr>.03;l.material.opacity=.55*xr}
    // highlight
    for(const id in gm){const lv=S.sel===id?.4+.12*Math.sin(t*4):hover===id?.2:0;for(const m of gm[id])m.emissive.copy(m.userData.eb).lerp(acc[id],lv)}
    // labels
    const w=box.clientWidth,hh=box.clientHeight;
    for(const id in labels){G[id].updateMatrixWorld();v.set(...ANC[id]);G[id].localToWorld(v);v.project(cam);
      labels[id].style.transform='translate('+((v.x*.5+.5)*w)+'px,'+((-v.y*.5+.5)*hh)+'px) translate(-50%,-130%)';
      labels[id].classList.toggle('on',S.sel===id)}
    renderer.render(scene,cam);
  }
  frame();
  return()=>{cancelAnimationFrame(raf);ro.disconnect();renderer.dispose();Object.values(labels).forEach(l=>l.remove());el.remove()};
}

/* ---------- UI ---------- */
const RST='<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>';
const Icon=({p,s=16})=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',className:'shrink-0',dangerouslySetInnerHTML:{__html:p}});
const Tog=({on,onClick,icon,label})=>h('button',{onClick,'aria-label':label,title:label,className:'flex items-center gap-2 h-9 px-2.5 sm:px-3 rounded-lg text-xs font-semibold border backdrop-blur transition '+(on?'bg-cyan-400/15 border-cyan-300/60 text-cyan-200':'bg-zinc-900/80 border-zinc-700 text-zinc-300 hover:border-zinc-500')},h(Icon,{p:icon}),h('span',{className:'hidden sm:inline'},label));

function App(){
  const [asm,setAsm]=useState(100),[xray,setXray]=useState(false),[sel,setSel]=useState(null),[spin,setSpin]=useState(false);
  const mount=useRef(null),S=useRef({});
  Object.assign(S.current,{asm,xray,sel,spin});
  useEffect(()=>initScene(mount.current,S.current,setSel),[]);
  const P=PARTS.find(p=>p.id===sel);

  return h('div',{className:'h-[100dvh] flex flex-col md:flex-row text-zinc-200'},
    h('div',{className:'relative flex-1 min-h-0 min-w-0'},
      h('div',{ref:mount,className:'absolute inset-0'}),
      h('div',{className:'absolute top-3 left-3 flex items-center gap-3 pointer-events-none'},
        h('div',{className:'rounded-xl px-3 py-1.5 shadow-lg shadow-black/60 ring-1 ring-white/30',style:{background:'linear-gradient(180deg,#fff,#e9e9ec)'}},
          h('img',{src:LOGO,alt:'Brhan',className:'h-7 sm:h-9 md:h-11 w-auto block'})),
        h('h1',{className:'hidden lg:block text-sm font-semibold tracking-wide text-zinc-300'},'Anatomy of a Modern Camera')),
      h('div',{className:'absolute top-3 right-3 flex gap-2'},
        h(Tog,{on:xray,onClick:()=>setXray(!xray),icon:IC.eye,label:'X-Ray'}),
        h(Tog,{on:spin,onClick:()=>setSpin(!spin),icon:IC.spin,label:'Spin'}),
        h(Tog,{on:false,onClick:()=>{S.current.reset=true},icon:RST,label:'Reset'})),
      h('div',{className:'absolute bottom-3 left-3 right-3 max-w-xl mx-auto rounded-xl border border-zinc-800 bg-black/70 backdrop-blur px-3 py-2.5'},
        h('div',{className:'flex items-center justify-between'},
          h('label',{htmlFor:'asm',className:'text-xs font-bold tracking-wider uppercase text-zinc-300'},'Camera Assembly'),
          h('span',{className:'text-sm font-bold text-amber-300 tabular-nums'},asm+'%')),
        h('input',{id:'asm',type:'range',min:0,max:100,value:asm,onChange:e=>setAsm(+e.target.value),className:'my-1'}),
        h('div',{className:'flex justify-between text-[10px] uppercase tracking-wider text-zinc-500'},
          h('button',{onClick:()=>setAsm(0),className:'hover:text-zinc-200'},'Exploded'),
          h('button',{onClick:()=>setAsm(100),className:'hover:text-zinc-200'},'Assembled')))),
    h('aside',{className:'md:w-[340px] h-[40%] md:h-full shrink-0 overflow-y-auto border-t md:border-t-0 md:border-l border-zinc-800 bg-[#0a0a0c] p-3 md:p-4'},
      h('div',{className:'flex md:grid gap-2 overflow-x-auto md:overflow-visible pb-2 md:pb-0 mb-3'},PARTS.map((p,i)=>h('button',{key:p.id,onClick:()=>setSel(sel===p.id?null:p.id),
        className:'shrink-0 flex items-center gap-2.5 rounded-lg border px-3 py-2 text-left transition '+(sel===p.id?'bg-zinc-800':'bg-zinc-900/40 hover:bg-zinc-900 border-zinc-800'),
        style:sel===p.id?{borderColor:p.color}:null},
        h('span',{className:'w-7 h-7 rounded-md grid place-items-center',style:{background:p.color+'22',color:p.color}},h(Icon,{p:IC[p.id]})),
        h('span',{className:'text-sm font-semibold text-zinc-100 whitespace-nowrap'},p.name)))),
      P?h('div',{key:P.id,className:'rounded-xl border p-4',style:{borderColor:P.color+'66',background:P.color+'0d'}},
          h('div',{className:'flex items-center gap-2 mb-2',style:{color:P.color}},h(Icon,{p:IC[P.id],s:20}),h('h2',{className:'text-lg font-extrabold text-white'},P.name)),
          h('p',{className:'text-sm leading-relaxed text-zinc-300 mb-3'},P.body),
          h('ul',{className:'space-y-2'},P.pts.map(x=>h('li',{key:x,className:'flex gap-2 text-[13px] text-zinc-400'},h('span',{className:'mt-1.5 w-1.5 h-1.5 rounded-full shrink-0',style:{background:P.color}}),x))))
        :h('p',{className:'rounded-xl border border-dashed border-zinc-700 p-4 text-sm text-zinc-400'},'Select a part to explore.')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
